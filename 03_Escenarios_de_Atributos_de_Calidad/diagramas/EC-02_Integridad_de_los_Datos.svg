cx='294' cy='390' r='15' fill='#D9731A'/><text x='294' y='396' text-anchor='middle' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='17' font-weight='700' fill='#FFFFFF'>2</text><text x='318' y='396' text-anchor='start' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='17' font-weight='700' fill='#D9731A'>Estímulo</text><text x='282' y='422' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='16' fill='#1E2A36'>Respuesta incorrecta en el</text><text x='282' y='444' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='16' fill='#1E2A36'>tiempo: la respuesta a una</text><text x='282' y='466' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='16' fill='#1E2A36'>expedición ya enviada se</text><text x='282' y='488' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='16' fill='#1E2A36'>pierde o llega tarde; no se</text><text x='282' y='510' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='16' fill='#1E2A36'>sabe si el RNDC la registró</text><rect x='582' y='356' width='300' height='320' rx='12' fill='#F3F5F7' stroke='#6B7B8C' stroke-opacity='0.35' stroke-width='1.5'/><rect x='582' y='356' width='300' height='6' rx='3' fill='#6B7B8C'/><circle cx='610' cy='390' r='15' fill='#6B7B8C'/><text x='610' y='396' text-anchor='middle' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='17' font-weight='700' fill='#FFFFFF'>4</text><text x='634' y='396' text-anchor='start' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='17' font-weight='700' fill='#6B7B8C'>Ambiente</text><text x='598' y='422' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='16' fill='#1E2A36'>Operación normal con el RNDC</text><text x='598' y='444' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='16' fill='#1E2A36'>respondiendo lento; la</text><text x='598' y='466' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='16' fill='#1E2A36'>solicitud ya tiene</text><text x='598' y='488' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='16' fill='#1E2A36'>identificador interno</text><rect x='898' y='356' width='380' height='320' rx='12' fill='#E9F6EE' stroke='#2E8B57' stroke-opacity='0.35' stroke-width='1.5'/><rect x='898' y='356' width='380' height='6' rx='3' fill='#2E8B57'/><circle cx='926' cy='390' r='15' fill='#2E8B57'/><text x='926' y='396' text-anchor='middle' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='17' font-weight='700' fill='#FFFFFF'>5</text><text x='950' y='396' text-anchor='start' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='17' font-weight='700' fill='#2E8B57'>Respuesta</text><circle cx='919' cy='417' r='4' fill='#2E8B57'/><text x='930' y='422' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='16' fill='#1E2A36'>Marcar «Pendiente de conciliación»</text><text x='930' y='444' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='16' fill='#1E2A36'>sin reenviar la creación</text><circle cx='919' cy='469' r='4' fill='#2E8B57'/><text x='930' y='474' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='16' fill='#1E2A36'>Consultar el estado en el RNDC</text><circle cx='919' cy='499' r='4' fill='#2E8B57'/><text x='930' y='504' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='16' fill='#1E2A36'>Si existe: «Emitida» con número</text><text x='930' y='526' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='16' fill='#1E2A36'>oficial</text><circle cx='919' cy='551' r='4' fill='#2E8B57'/><text x='930' y='556' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='16' fill='#1E2A36'>Si no existe: un reintento con el</text><text x='930' y='578' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='16' fill='#1E2A36'>mismo id; si no se resuelve,</text><text x='930' y='600' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='16' fill='#1E2A36'>revisión manual</text><circle cx='919' cy='625' r='4' fill='#2E8B57'/><text x='930' y='630' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='16' fill='#1E2A36'>Avisar al operador «en verificación»</text><rect x='1294' y='356' width='276' height='320' rx='12' fill='#F2ECF9' stroke='#7A4FB0' stroke-opacity='0.35' stroke-width='1.5'/><rect x='1294' y='356' width='276' height='6' rx='3' fill='#7A4FB0'/><circle cx='1322' cy='390' r='15' fill='#7A4FB0'/><text x='1322' y='396' text-anchor='middle' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='17' font-weight='700' fill='#FFFFFF'>6</text><text x='1346' y='396' text-anchor='start' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='17' font-weight='700' fill='#7A4FB0'>Medida de la respuesta</text><circle cx='1315' cy='417' r='4' fill='#7A4FB0'/><text x='1326' y='422' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='16' fill='#1E2A36'>0 manifiestos duplicados</text><circle cx='1315' cy='447' r='4' fill='#7A4FB0'/><text x='1326' y='452' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='16' fill='#1E2A36'>0 «Emitida» sin número</text><text x='1326' y='474' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='16' fill='#1E2A36'>oficial</text><circle cx='1315' cy='499' r='4' fill='#7A4FB0'/><text x='1326' y='504' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='16' fill='#1E2A36'>100 % de respuestas</text><text x='1326' y='526' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='16' fill='#1E2A36'>inciertas conciliadas o</text><text x='1326' y='548' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='16' fill='#1E2A36'>en revisión ≤ 30 min</text><circle cx='1315' cy='573' r='4' fill='#7A4FB0'/><text x='1326' y='578' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='16' fill='#1E2A36'>100 % de intentos</text><text x='1326' y='600' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='16' fill='#1E2A36'>registrados</text><text